<meta charset="utf-8">
<title>Catlendar</title>
<style>
  :root{
    /* A saturated purple line, not near-white: the cat sits on whatever is
       behind it, and a pale stroke vanished on light windows. */
    --glow:#c084fc; --line:#9333ea; --glow-2:#57e8ff;
    --pill-bg:rgba(18,16,28,.72); --pill-line:rgba(180,107,255,.45); --pill-text:#efe4ff;
    /* a hairline dark rim, so the pale stroke still reads on a white window */
    --rim:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 0 2.5px rgba(255,255,255,.3));
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-user-select:none;cursor:default}
  #stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
  svg{width:150px;height:150px;overflow:visible}

  #cat{
    stroke:var(--line); fill:none; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round;
    filter:var(--rim) drop-shadow(0 0 7px var(--glow)) drop-shadow(0 0 17px var(--glow));
    animation:breathe 4.2s ease-in-out infinite;
    transform-origin:100px 170px;
  }
  @keyframes breathe{
    0%,100%{ transform:scaleY(1) translateY(0); opacity:.94 }
    50%    { transform:scaleY(1.015) translateY(-1.5px); opacity:1 }
  }
  #tail{ transform-origin:129px 168px; animation:sway 3.4s ease-in-out infinite }
  @keyframes sway{ 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(6deg)} }

  .eye{ transform-origin:center; animation:blink 6.5s infinite }
  #eyeL{ transform-box:fill-box } #eyeR{ transform-box:fill-box; animation-delay:.06s }
  @keyframes blink{ 0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)} }

  #zzz{ opacity:0; transform-origin:157px 42px }
  #callicon{ opacity:0; transform-origin:166px 40px }
  #pill{
    margin-top:2px; padding:3px 10px; border-radius:99px; background:var(--pill-bg);
    border:1px solid var(--pill-line); color:var(--pill-text); font-size:11px; font-weight:600;
    letter-spacing:.2px; white-space:nowrap; backdrop-filter:blur(8px);
    box-shadow:0 0 14px rgba(180,107,255,.28); max-width:180px; overflow:hidden; text-overflow:ellipsis;
  }
  #sub{ font-weight:400; opacity:.72 }

  #curled{
    stroke:var(--line); fill:none; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round;
    filter:var(--rim) drop-shadow(0 0 6px var(--glow));
    opacity:0; transform-origin:105px 145px; animation:snooze 5.4s ease-in-out infinite;
  }
  #extras{
    stroke:var(--line); fill:none; stroke-linecap:round; stroke-linejoin:round;
    filter:var(--rim) drop-shadow(0 0 7px var(--glow));
  }
  @keyframes snooze{ 0%,100%{transform:scale(1) translateY(0)} 50%{transform:scale(1.02) translateY(-1px)} }
  #moon, #sparks, #bowl, #heart{ opacity:0 }

  /* ---- states ---- */
  /* away: still at the desk, eyes shut, no z's yet */
  body[data-state="away"] #cat{ animation-duration:7s; opacity:.74;
    filter:var(--rim) drop-shadow(0 0 6px var(--glow)) }
  body[data-state="away"] #tail{ animation-duration:7s }
  body[data-state="away"] .eye{ animation:none; transform:scaleY(.08); transform-box:fill-box }

  /* asleep: curled up, fifteen minutes untouched */
  body[data-state="asleep"] #cat{ opacity:0; animation:none }
  body[data-state="asleep"] #curled{ opacity:.8 }
  body[data-state="asleep"] #zzz{ animation:float 4.2s ease-in-out infinite }

  /* a meeting about to start */
  body[data-state="soon"]{ --glow:#fb923c; --line:#c2410c }
  body[data-state="soon"] #cat{ animation:alert 1.1s ease-in-out infinite }
  @keyframes alert{
    0%,100%{ transform:translateY(0) } 30%{ transform:translateY(-5px) } 60%{ transform:translateY(0) } }
  body[data-state="soon"] #tail{ animation-duration:1.1s }
  body[data-state="soon"] #callicon{ opacity:1 }

  /* after midnight */
  body[data-night="1"] #moon{ opacity:.85 }
  /* must not resurrect the sitting cat while it is curled up asleep: same
     specificity as the asleep rule and it comes later, so it would win */
  body[data-night="1"]:not([data-state="asleep"]):not([data-state="paused"]) #cat{ opacity:.85 }

  /* transient moves, set by JS and cleared on their own */
  body[data-move="stretch"] #cat{ animation:stretch 2.4s ease-in-out }
  @keyframes stretch{
    0%   { transform:scaleX(1) scaleY(1) translateY(0) rotate(0) }
    18%  { transform:scaleX(1.18) scaleY(.82) translateY(9px) rotate(-3deg) }
    40%  { transform:scaleX(1.22) scaleY(.80) translateY(10px) rotate(3deg) }
    62%  { transform:scaleX(.92) scaleY(1.16) translateY(-9px) rotate(0) }
    80%  { transform:scaleX(1.05) scaleY(.96) translateY(2px) }
    100% { transform:scaleX(1) scaleY(1) translateY(0) } }
  body[data-move="groom"] #cat{ animation:groom 2.2s ease-in-out }
  @keyframes groom{
    0%,100%{ transform:rotate(0) }
    25%{ transform:rotate(-7deg) } 50%{ transform:rotate(4deg) } 75%{ transform:rotate(-4deg) } }
  body[data-move="celebrate"] #cat{ animation:hop .55s ease-in-out 3 }
  body[data-move="celebrate"] #sparks{ opacity:1; animation:twinkle .55s ease-in-out 3 }
  @keyframes hop{
    0%,100%{ transform:translateY(0) scaleY(1) }
    30%{ transform:translateY(-14px) scaleY(1.06) }
    60%{ transform:translateY(0) scaleY(.94) } }
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(.8)} 50%{opacity:1; transform:scale(1.15)} }

  /* dinner */
  body[data-move="feed"] #bowl{ opacity:1; animation:bowlin 3.4s ease-out }
  body[data-move="feed"] #heart{ animation:heartup 3.4s ease-out }
  body[data-move="feed"] #cat{ animation:eat 3.4s ease-in-out }
  body[data-move="feed"] #tail{ animation:sway .9s ease-in-out infinite }
  @keyframes bowlin{ 0%{opacity:0; transform:translateY(8px)} 12%{opacity:1; transform:none}
                     88%{opacity:1} 100%{opacity:0} }
  @keyframes eat{
    0%  { transform:rotate(0) translate(0,0) }
    14% { transform:rotate(-11deg) translate(-12px,6px) }
    26% { transform:rotate(-16deg) translate(-17px,9px) }
    38% { transform:rotate(-11deg) translate(-12px,6px) }
    50% { transform:rotate(-16deg) translate(-17px,9px) }
    62% { transform:rotate(-11deg) translate(-12px,6px) }
    74% { transform:rotate(-5deg) translate(-5px,2px) }
    100%{ transform:rotate(0) translate(0,0) } }
  @keyframes heartup{
    0%,55%{ opacity:0; transform:translateY(0) scale(.6) }
    70%{ opacity:.95; transform:translateY(-10px) scale(1) }
    100%{ opacity:0; transform:translateY(-30px) scale(1.15) } }

  /* a nudge when you point at it */
  #stage:hover #cat{ animation:perk 1.4s ease-in-out infinite }
  @keyframes perk{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes float{
    0%  { transform:translate(0,4px) scale(.75); opacity:0 }
    30% { opacity:.95 }
    100%{ transform:translate(11px,-24px) scale(1.15); opacity:0 }
  }
  body[data-state="meeting"]{ --glow:#22d3ee; --line:#0e7490 }
  body[data-state="meeting"] #callicon{ opacity:1; animation:ping 2.2s ease-in-out infinite }
  @keyframes ping{ 0%,100%{opacity:.6; transform:scale(.96)} 50%{opacity:1; transform:scale(1.04)} }
  body[data-state="meeting"] #tail{ animation-duration:1.9s }
  body[data-state="focus"] #cat{
    filter:var(--rim) drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 26px var(--glow));
    animation-duration:5.6s }
  body[data-state="focus"] #tail{ animation-duration:6s }
  body[data-state="paused"] #cat{ opacity:.55;
    filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 0 4px rgba(120,120,150,.55));
    animation:none; stroke:#8b8b9e }
  body[data-state="paused"] #extras{ opacity:0 }
  body[data-state="paused"] #curled{ opacity:0 }
  body[data-state="paused"] #tail{ animation:none }
  body[data-state="paused"] .eye{ animation:none }
</style>

<div id="stage">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <g id="cat">
      <!-- body, sitting -->
      <path d="M72 104 C58 124 52 146 55 166 C57 177 65 182 77 182
               L120 182 C133 182 140 176 138 165 C134 143 128 122 120 104"/>
      <!-- tail -->
      <path id="tail" d="M137 170 C160 175 175 162 174 145 C173 132 161 126 152 131
                         C144 136 146 149 157 148"/>
      <!-- head with ears -->
      <path d="M66 76 L61 32 L84 50 C92 47 108 47 116 50 L139 32 L134 76
               C134 97 118 110 100 110 C82 110 66 97 66 76 Z"/>
      <!-- whiskers -->
      <path d="M58 68 L32 62 M57 77 L30 77 M58 86 L33 92"/>
      <!-- eyes -->
      <path id="eyeL" class="eye" d="M86 74 L86 80"/>
      <path id="eyeR" class="eye" d="M114 74 L114 80"/>
      <!-- nose -->
      <path d="M97 90 L100 93 L103 90"/>
      <!-- meeting: a little call window floating beside the cat -->
      <g id="callicon" stroke-width="2.8">
        <rect x="146" y="30" width="30" height="21" rx="5"/>
        <path d="M176 36 L186 31 L186 50 L176 45 Z"/>
        <circle cx="155" cy="40.5" r="2.2" fill="var(--line)" stroke="none"/>
      </g>
    </g>

    <!-- curled up asleep -->
    <g id="curled">
      <path d="M92 116 C122 104 160 114 170 140 C178 159 164 177 138 179
               L78 179 C56 179 44 171 42 158"/>
      <path d="M38 140 C38 122 52 110 70 110 C88 110 100 122 100 140
               C100 158 88 168 70 168 C52 168 38 158 38 140 Z"/>
      <path d="M47 117 L44 102 L59 111 M83 111 L97 102 L94 117"/>
      <path d="M54 139 C58 144 65 144 69 139"/>
      <path d="M170 146 C184 152 186 169 169 176 C153 182 131 179 120 173"/>
    </g>

    <!-- props, outside both bodies so they show whichever pose is up -->
    <g id="extras">
      <g id="zzz" stroke-width="2.8">
        <path d="M150 34 L164 34 L150 50 L164 50"/>
      </g>
      <g id="moon" stroke-width="2.6">
        <path d="M176 30 A15 15 0 1 0 176 58 A12 12 0 1 1 176 30 Z"/>
      </g>
      <!-- on the open side, clear of the tail -->
      <g id="bowl" stroke-width="2.8">
        <path d="M12 172 L58 172"/>
        <path d="M15 172 C16 187 54 187 55 172"/>
        <path d="M26 166 h.01 M35 164 h.01 M44 166 h.01" stroke-width="4.5"/>
      </g>
      <g id="heart" stroke-width="2.6">
        <path d="M62 62 C62 54 52 52 49 59 C46 52 36 54 36 62
                 C36 72 49 80 49 80 C49 80 62 72 62 62 Z"/>
      </g>
      <g id="sparks" stroke-width="2.6">
        <path d="M150 40 L150 28 M144 34 L156 34"/>
        <path d="M34 54 L34 44 M29 49 L39 49"/>
        <path d="M168 92 L168 84 M164 88 L172 88"/>
      </g>
    </g>
  </svg>
  <div id="pill"><span id="main">starting up</span> <span id="sub"></span></div>
</div>

<script>
  let lastState = 'work';
  let moveTimer = null;

  function playMove(move, ms){
    clearTimeout(moveTimer);
    document.body.dataset.move = move;
    moveTimer = setTimeout(() => { document.body.dataset.move = ''; }, ms);
  }

  window.setCat = function(state, main, sub, night){
    state = state || 'work';
    /* waking up earns a stretch */
    if ((lastState === 'asleep' || lastState === 'away') &&
        (state === 'work' || state === 'focus' || state === 'typing')){
      playMove('stretch', 2400);
    }
    lastState = state;
    document.body.dataset.state = state;
    document.body.dataset.night = night ? '1' : '0';
    document.getElementById('main').textContent = main || '';
    document.getElementById('sub').textContent = sub || '';
  };

  const MOVE_MS = {celebrate: 1800, feed: 3400, stretch: 2400, groom: 2200};
  window.catMove = function(move){
    playMove(move, MOVE_MS[move] || 2200);
  };
  window.catFeed = function(){ playMove('feed', MOVE_MS.feed); };

  /* every so often, while working, the cat washes its face */
  setInterval(() => {
    const s = document.body.dataset.state;
    if ((s === 'work' || s === 'typing') && !document.body.dataset.move && Math.random() < 0.25){
      playMove('groom', 2200);
    }
  }, 45000);

  document.body.dataset.state = 'work';
</script>
